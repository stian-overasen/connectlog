[project]
name = "connectlog"
version = "0.1.0"
description = "MCP server to fetch Garmin Connect health data for ME/CFS PEM threshold research"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "garminconnect>=0.3.17,<0.4",
    "keyring>=25.7",
    "mcp>=1.26,<2",
]

[project.scripts]
connectlog = "app:run_mcp_server"
connectlog-setup = "setup_oauth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "credentials.py", "setup_oauth.py"]

[dependency-groups]
dev = [
    "codespell",
    "pre-commit",
    "prettier",
    "ruff",
]

[tool.uv]
required-version = ">=0.9.13"

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.codespell]
skip = '*.http,*.json'
